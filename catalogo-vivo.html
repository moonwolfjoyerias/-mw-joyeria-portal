<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — MW Joyería</title>
  <meta name="description" content="Catálogo de joyería MW con precio etiqueta.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/styles.css?v=57">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
</head>
<body class="catalogo-vivo">

  <!-- Link que cada Emprendedora/Líder comparte con sus clientas (ver
       js/catalogo-vivo.js): solo el catálogo — sin menú, sin pie de
       página ni enlaces al resto del sitio. -->
  <header class="topbar">
    <span class="logo">
      <img src="assets/images/isotipo-blanco.png" alt="MOONWOLF Joyería">
      <span class="logo-text">
        <span class="logo-main">MOONWOLF</span>
        <span class="logo-sub">JOYERÍA</span>
      </span>
    </span>
  </header>

  <main class="page-shell" style="padding: 2rem 1.2rem 4rem;">
    <section class="catalogo-vivo-hero" style="max-width: 1200px; margin: 0 auto 1.5rem;">
      <span class="eyebrow">Catálogo en vivo</span>
      <h1 id="catalogoVivoTitulo" style="margin:0.3rem 0 0.5rem;">Catálogo</h1>
      <p class="lede" id="catalogoVivoSub" style="max-width: 700px;">Cargando…</p>
      <a class="btn btn-whatsapp" id="catalogoVivoWhatsapp" href="#" target="_blank" rel="noopener" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 11.6a8.5 8.5 0 01-12.6 7.4L3.5 20.5l1.6-4.2A8.5 8.5 0 1120.5 11.6z"/></svg>
        <span>Escríbeme por WhatsApp</span>
      </a>
    </section>

    <div class="catalog-layout" id="catalogoVivoContenido" style="max-width: 1200px; margin: 0 auto; display:none;">
      <aside class="filter-panel">
        <div class="filter-panel-header">
          <h3>Filtros</h3>
          <button id="clearFiltersBtn" type="button">Limpiar</button>
        </div>

        <div class="filter-group">
          <h4>Material</h4>
          <div id="filterMateriales"></div>
        </div>

        <div class="filter-group">
          <h4>Categoría</h4>
          <div id="filterCategorias"></div>
        </div>

        <div class="filter-group conditional visible">
          <h4>Color de oro</h4>
          <div id="filterColorOro"></div>
        </div>

        <div class="filter-group">
          <h4>Talla</h4>
          <select id="filterTalla" style="width:100%; height:42px; border:1px solid var(--mw-border); border-radius:8px; padding:0 12px; color:var(--mw-text); background:var(--surface);">
            <option value="">Todas</option>
          </select>
        </div>
      </aside>

      <div class="catalog-grid-wrap">
        <div class="catalog-toolbar catalogo-vivo-toolbar">
          <div class="catalog-search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input type="search" id="catalogoVivoBuscar" placeholder="Buscar pieza…" aria-label="Buscar pieza">
          </div>
          <span class="result-count" id="resultCount">0 piezas</span>
        </div>
        <div class="catalog-product-grid" id="catalogGrid"></div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="js/filtros-movil.js?v=1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=2"></script>
  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/staff-catalogo-ejemplo.js?v=4"></script>
  <script src="js/catalogo-firestore-sync.js?v=6"></script>
  <script src="js/dom-utils.js?v=7"></script>
  <script src="js/catalogo-variantes-modelo.js?v=11"></script>
  <script src="js/catalogo-vivo.js?v=1"></script>
</body>
</html>
