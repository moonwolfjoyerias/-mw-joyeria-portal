<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal — Staff MW</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/styles.css?v=9">
</head>
<body>

  <div class="layout-portal">
    <aside class="sidebar">
      <a href="../index.html" class="brand-link">
        <img src="../assets/images/isotipo-blanco.png" alt="MOONWOLF Joyería">
        <span>
          <span class="logo-main">MOONWOLF</span>
          <span class="logo-sub">JOYERÍA</span>
        </span>
      </a>
      <nav>
        <a href="staff-portal.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          Inicio
        </a>
        <a href="staff-catalogo.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/></svg>
          Catálogo
        </a>
        <a href="staff-apartados.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
          Apartados
        </a>
        <a href="staff-calendario.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Calendario
        </a>
        <a href="staff-notificaciones.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          Notificaciones
        </a>
        <a href="staff-lista-deseos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-9.5-9A5.5 5.5 0 0112 5.5 5.5 5.5 0 0121.5 11c-2.5 4.6-9.5 9-9.5 9z"/></svg>
          Lista de deseos
        </a>
      </nav>
    </aside>
    
    <main class="main-content">
      <header class="portal-header">
        <div>
          <h1>Catálogo</h1>
          <p class="portal-sub">Precio de mayoreo ya con tu descuento aplicado.</p>
        </div>

        <div class="portal-header-actions">
          <button class="notif-bell" id="notifBell" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="notif-badge" id="notifBadge">0</span>
          </button>
          <div class="notif-panel" id="notifPanel"></div>

          <button class="profile-btn" id="profileBtn">
            <span class="profile-avatar">E</span>
            <span class="profile-info">
              <strong>Staff</strong>
              <span class="profile-role">Staff MW</span>
            </span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="profile-menu" id="profileMenu">
            <a href="#" data-modal="foto">Cambiar foto de perfil</a>
            <a href="../login.html" class="danger">Cerrar sesión</a>
          </div>
        </div>
      </header>

      <div class="catalog-layout">
        <aside class="filter-panel">
          <div class="filter-panel-header">
            <h3>Filtros</h3>
            <button id="clearFiltersBtn">Limpiar</button>
          </div>

          <div class="filter-group">
            <h4>Material</h4>
            <div id="filterMateriales"></div>
          </div>

          <div class="filter-group">
            <h4>Categoría</h4>
            <div id="filterCategorias"></div>
          </div>

          <div class="filter-group conditional visible">
            <h4>Calidad (Oro Laminado)</h4>
            <div id="filterCalidad"></div>
          </div>

          <div class="filter-group conditional visible">
            <h4>Color de oro</h4>
            <div id="filterColorOro"></div>
          </div>

          <div class="filter-group">
            <h4>Talla (Anillos / Cadenas)</h4>
            <select id="filterTalla"></select>
          </div>
        </aside>

        <div class="catalog-grid-wrap">
          <div class="catalog-toolbar">
            <span class="result-count" id="resultCount"></span>
          </div>
          <div class="catalog-product-grid" id="catalogGrid"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="../js/notificaciones-ejemplo.js"></script>
  <script src="../js/eventos-ejemplo.js"></script>
  <script>
  const PORTAL_LINKS = {
    inicio: 'lider-portal.html',
    catalogo: 'lider-catalogo.html',
    apartados: 'lider-apartados.html',
    equipo: 'lider-mi-equipo.html',
    deseos: 'lider-lista-deseos.html',
    calendario: 'lider-calendario.html',
    cuenta: 'lider-mi-cuenta.html',
  };
  </script>
  <script src="../js/portal-common.js"></script>
  <script src="../js/apartados-ejemplo.js"></script>
  <script src="../js/catalogo-productos-ejemplo.js"></script>
  <script src="../js/catalogo.js"></script>
</body>
</html>
