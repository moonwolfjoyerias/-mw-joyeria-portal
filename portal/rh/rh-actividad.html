<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad — Portal RH MW</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../../css/styles.css?v=18">
</head>
<body>

  <div class="layout-portal">
    <aside class="sidebar">
      <a href="../../index.html" class="brand-link">
        <img src="../../assets/images/isotipo-blanco.png" alt="MOONWOLF Joyería">
        <span>
          <span class="logo-main">MOONWOLF</span>
          <span class="logo-sub">JOYERÍA</span>
        </span>
      </a>
      <nav>
        <a href="../rh/rh-portal.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          Inicio
        </a>
        <a href="../rh/rh-catalogo.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/></svg>
          Catálogo
        </a>
        <a href="../rh/rh-apartados.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
          Apartados
        </a>
        <a href="../rh/rh-calendario.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Calendario
        </a>
        <a href="../rh/rh-lista-deseos.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 20s-7-4.4-9.5-9A5.5 5.5 0 0112 5.5 5.5 5.5 0 0121.5 11c-2.5 4.6-9.5 9-9.5 9z"/></svg>
          Lista de deseos
        </a>
        <a href="../rh/rh-actividad.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
          Actividad
        </a>
        <a href="../rh/rh-nomina.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6"/></svg>
          Nómina
        </a>
        <a href="../rh/rh-mi-cuenta.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          Mi cuenta
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="portal-header">
        <div>
          <h1>Actividad</h1>
          <p class="portal-sub">Últimas acciones de Staff, RH y Admin — quién, qué y cuándo.</p>
        </div>

        <div class="portal-header-actions">
          <button class="notif-bell" id="notifBell" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="notif-badge" id="notifBadge">0</span>
          </button>
          <div class="notif-panel" id="notifPanel"></div>

          <button class="profile-btn" id="profileBtn">
            <span class="profile-avatar">R</span>
            <span class="profile-info">
              <strong>Recursos Humanos</strong>
              <span class="profile-role">RH MW</span>
            </span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="profile-menu" id="profileMenu">
            <a href="#" data-modal="foto">Cambiar foto de perfil</a>
            <a href="../../login.html" class="danger">Cerrar sesión</a>
          </div>
        </div>
      </header>

      <div class="catalog-toolbar" style="justify-content:space-between;align-items:center;">
        <span class="result-count" id="actividadCount"></span>
        <select id="filtroRolActividad">
          <option value="">Todos los roles</option>
          <option value="staff">Staff</option>
          <option value="rh">RH</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <div class="catalog-table-card">
        <div class="catalog-table-wrap">
          <table class="catalog-table" style="min-width:0;">
            <thead>
              <tr>
                <th>Persona</th>
                <th>Acción realizada</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody id="actividadBody"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="../../js/notificaciones-ejemplo.js"></script>
  <script src="../../js/eventos-ejemplo.js"></script>
  <script>
  const PORTAL_LINKS = {
    inicio: '../rh/rh-portal.html',
    catalogo: '../rh/rh-catalogo.html',
    apartados: '../rh/rh-apartados.html',
    deseos: '../rh/rh-lista-deseos.html',
    calendario: '../rh/rh-calendario.html',
    notificaciones: '../rh/rh-mi-cuenta.html',
  };
  </script>
  <script src="../../js/portal-common.js"></script>
  <script>const ACTIVIDAD_ROL_VISOR = 'rh';</script>
  <script src="../../js/auditoria-modelo.js"></script>
  <script src="../../js/actividad.js"></script>
</body>
</html>
